name: Bootstrap Regard

on:
  push:
    branches: [refactor/initial-regard]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Regard
        uses: actions/checkout@v6
        with:
          ref: refactor/initial-regard

      - name: Fetch template and legacy framework content
        run: |
          git clone --depth 1 https://github.com/aleascript/resonance-site-template.git /tmp/resonance-site-template
          git clone --depth 1 https://github.com/aleascript/resonance.git /tmp/resonance

      - name: Build Regard from the shared site template
        shell: bash
        run: |
          set -euo pipefail
          # Workflow files are intentionally excluded here: GitHub's runner token
          # cannot modify them through the App. They are installed separately.
          rsync -a --exclude='.git' --exclude='.github/workflows' /tmp/resonance-site-template/ ./

          python <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          # The template ships Resonance identity examples. Regard deliberately
          # starts without them until its final logo asset is committed.
          shutil.rmtree(root / 'static' / 'img' / 'site', ignore_errors=True)

          site_config = r'''/**
           * Regard-specific values. The site structure and visual system come
           * from resonance-site-template; project identity lives here.
           */

          export type SiteIdentity = {
            logo: string | null;
            favicon: string | null;
          };

          export type ProjectLink = {
            label: string;
            href: string;
          };

          export type SiteLineage = {
            designedWith: ProjectLink | null;
            poweredBy: ProjectLink | null;
          };

          export type ContentLicense = {
            label: string;
            href: string;
            attribution: {
              title: string;
              author: string;
              href: string | null;
            };
          };

          export type ThemePalette = {
            primary: string;
            background: string;
            surface: string;
            text: string;
            muted: string;
            border: string;
          };

          export type SiteTheme = {
            colors: {
              light: ThemePalette;
              dark: ThemePalette;
            };
            typography: {
              body: string;
              heading: string;
              mono: string;
              headingWeight: number;
            };
            shape: {
              radius: string;
              borderWidth: string;
              navbarShadow: string;
            };
            layout: {
              contentWidth: string;
            };
          };

          export const site = {
            title: 'Regard',
            tagline: 'A TTRPG framework with a fully playable standard configuration',
            description: 'A TTRPG framework in which fiction determines what matters and can shape how uncertainty is resolved.',
            author: 'AleaScript',
            defaultLocale: 'en',
            locales: {
              en: {
                htmlLang: 'en',
                label: 'English',
              },
              fr: {
                htmlLang: 'fr',
                label: 'Français',
              },
            },
            repository: {
              defaultFullName: 'aleascript/regard',
            },
            identity: {
              logo: null,
              favicon: null,
            } satisfies SiteIdentity,
            license: {
              label: 'CC BY 4.0',
              href: 'https://creativecommons.org/licenses/by/4.0/',
              attribution: {
                title: 'Regard',
                author: 'AleaScript',
                href: null,
              },
            } satisfies ContentLicense,
            lineage: {
              designedWith: {
                label: 'Resonance',
                href: 'https://aleascript.github.io/resonance/',
              },
              poweredBy: null,
            } as SiteLineage,
            theme: {
              colors: {
                light: {
                  primary: '#315da8',
                  background: '#fcfcfd',
                  surface: '#f4f6f9',
                  text: '#202a38',
                  muted: '#667085',
                  border: '#d7dce4',
                },
                dark: {
                  primary: '#8eb6f4',
                  background: '#10141b',
                  surface: '#171d27',
                  text: '#edf2f7',
                  muted: '#aeb8c7',
                  border: '#303949',
                },
              },
              typography: {
                body: 'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                heading: 'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                mono: '"SFMono-Regular", Consolas, "Liberation Mono", monospace',
                headingWeight: 650,
              },
              shape: {
                radius: '0.4rem',
                borderWidth: '1px',
                navbarShadow: '0 1px 0 rgb(20 29 43 / 10%)',
              },
              layout: {
                contentWidth: '52rem',
              },
            } satisfies SiteTheme,
          } as const;
          '''
          site_config = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in site_config.splitlines()
          ).lstrip()
          (root / 'site.config.ts').write_text(site_config, encoding='utf-8')

          for filename in ('package.json', 'package-lock.json'):
              path = root / filename
              text = path.read_text(encoding='utf-8')
              path.write_text(
                  text.replace('resonance-site-template', 'regard'),
                  encoding='utf-8',
              )

          root_component = root / 'src' / 'theme' / 'Root.tsx'
          text = root_component.read_text(encoding='utf-8')
          text = text.replace('resonance-site:', 'regard-site:')
          text = text.replace('the previous Resonance site', 'the previous site')
          root_component.write_text(text, encoding='utf-8')

          for path in (root / 'i18n').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              path.write_text(text.replace('Resonance Site', 'Regard'), encoding='utf-8')

          shutil.rmtree(root / 'docs', ignore_errors=True)
          (root / 'docs' / 'en').mkdir(parents=True)
          (root / 'docs' / 'fr').mkdir(parents=True)

          def migrate(locale: str) -> None:
              source = Path('/tmp/resonance') / 'content' / locale / 'index.md'
              text = source.read_text(encoding='utf-8')
              text = re.sub(r'\A---\n.*?\n---\n+', '', text, count=1, flags=re.S)
              text = re.sub(r'!\[Resonance\]\(\.\./assets/header\.png\)\n+', '', text, count=1)

              # Scooby-Doo remains a Regard case study, but its full game content
              # now lives on its dedicated site rather than as a Regard subpage.
              if locale == 'fr':
                  text = text.replace(
                      'https://aleascript.github.io/resonance/fr/scooby-doo',
                      'https://aleascript.github.io/scooby-doo/fr/',
                  )
                  description = 'Le SRD de Regard : un framework de JdR où la fiction détermine ce qui compte et peut transformer la résolution.'
              else:
                  text = text.replace(
                      'https://aleascript.github.io/resonance/en/scooby-doo',
                      'https://aleascript.github.io/scooby-doo/',
                  )
                  description = 'The Regard SRD: a TTRPG framework where fiction determines what matters and can transform resolution.'

              text = text.replace('Resonance', 'Regard')
              frontmatter = (
                  '---\n'
                  'id: home\n'
                  'title: Regard — SRD\n'
                  'slug: /\n'
                  'sidebar_position: 1\n'
                  f'description: {description}\n'
                  '---\n\n'
              )
              (root / 'docs' / locale / 'index.md').write_text(
                  frontmatter + text.lstrip(), encoding='utf-8'
              )

          migrate('en')
          migrate('fr')

          readme = '''# Regard\n\nRegard is a TTRPG framework with a fully playable standard configuration.\n\nIt is designed with [Resonance](https://github.com/aleascript/resonance), an experimental game-design paradigm and laboratory.\n\nThe documentation is bilingual (English/French) and uses the shared [`resonance-site-template`](https://github.com/aleascript/resonance-site-template).\n'''
          (root / 'README.md').write_text(readme, encoding='utf-8')
          PY

      - name: Commit bootstrapped Regard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bootstrap Regard from Resonance site template"
          git push origin HEAD:refactor/initial-regard
