name: Fix Regard front matter

on:
  push:
    branches: [refactor/initial-regard]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/initial-regard

      - name: Quote YAML front matter descriptions
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/en/index.md'): (
                  'description: The Regard SRD: a TTRPG framework where fiction determines what matters and can transform resolution.',
                  'description: "The Regard SRD: a TTRPG framework where fiction determines what matters and can transform resolution."',
              ),
              Path('docs/fr/index.md'): (
                  'description: Le SRD de Regard : un framework de JdR où la fiction détermine ce qui compte et peut transformer la résolution.',
                  'description: "Le SRD de Regard : un framework de JdR où la fiction détermine ce qui compte et peut transformer la résolution."',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected front matter line not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/en/index.md docs/fr/index.md
          git commit -m "Fix Regard SRD YAML front matter"
          git push origin HEAD:refactor/initial-regard
